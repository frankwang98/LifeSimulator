name: C++ build and simulation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: clang-format-18 --dry-run --Werror src/*.h src/*.cpp tests/*.cpp examples/navigation/src/*.h examples/navigation/src/*.cpp
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/life_tree --strategy all --days 365 --output output
      - run: ./build/life_tree --config examples/worlds/my-world.conf --json > output/world.json
